name: Publish v1.0.10

on:
  push:
    paths:
      - ".github/workflows/publish-v1.0.10.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v1.0.9 baseline
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum douyin-dl.user.js | awk '{print $1}')"
          expected="83935f5b192e585461f60736e09c58b027ad47cd6ef1e5b9cc70f469165879a8"
          test "$actual" = "$expected"
          grep -Fq '// @version       1.0.9' douyin-dl.user.js

      - name: Apply approved v1.0.10 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/release-v110/patch.gz.b64 | gzip -dc > /tmp/v110.patch
          git apply --check /tmp/v110.patch
          git apply /tmp/v110.patch
          actual="$(sha256sum douyin-dl.user.js | awk '{print $1}')"
          expected="0d7ab1397aec13ff23080701f055c845f6d2ceba1f15240ebce570afda50b076"
          test "$actual" = "$expected"

      - name: Update README and Greasy Fork documentation
        run: python .github/release-v110/update_docs.py

      - name: Verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check douyin-dl.user.js
          grep -Fq '// @version       1.0.10' douyin-dl.user.js
          grep -Fq 'version: "V1.0.10"' douyin-dl.user.js
          grep -Fq 'v1.0.10' README.md
          grep -Fq 'V1.0.10' GREASYFORK.md
          if grep -Fq 'setInterval(' douyin-dl.user.js; then
            echo 'Unexpected setInterval found' >&2
            exit 1
          fi
          if grep -Fq 'requestAnimationFrame(' douyin-dl.user.js; then
            echo 'Unexpected requestAnimationFrame found' >&2
            exit 1
          fi
          if gh release view 1.0.10 --repo xiaohuitongxue88-ctrl/douyin-downloader >/dev/null 2>&1; then
            echo 'Release 1.0.10 already exists' >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit v1.0.10 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/release-v110 .github/workflows/publish-v1.0.10.yml
          git add douyin-dl.user.js README.md GREASYFORK.md
          git commit -m 'release: v1.0.10'
          git push origin HEAD:main

      - name: Publish GitHub Release 1.0.10
        shell: bash
        run: |
          set -euo pipefail
          gh release create 1.0.10 douyin-dl.user.js \
            --repo xiaohuitongxue88-ctrl/douyin-downloader \
            --target main \
            --title '1.0.10' \
            --notes $'修复作者信息页粉丝数量可能显示旧值或不准确数据的问题。\n\n优化作者统计归属校验、主页补取与缓存策略。\n\n全面复核视频、图集、原声音频、弹幕、作者主页扫描、批量任务、暂停恢复及媒体详情等关键功能路径。\n\n保持低资源运行策略并提升兼容稳定性。'
        env:
          GH_TOKEN: ${{ github.token }}
